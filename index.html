<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Sales Closer Upgrade</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <h1>🤖 Telegram Sales Closer Upgrade</h1>
    <p class="sub">Smarter sales replies • booking prompt • payment prompt • Telegram-ready</p>

    <div class="card">
      <label>Incoming customer message</label>
      <textarea id="message" rows="6" placeholder="Hi, how much is this?"></textarea>

      <button onclick="generateReply()">Generate Closing Reply</button>

      <label>Reply</label>
      <textarea id="output" rows="11" readonly></textarea>
    </div>

    <div class="card">
      <h2>Telegram webhook route</h2>
      <p><code>/webhook/telegram</code></p>
      <h2>Health check</h2>
      <p><code>/health</code></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>\n
